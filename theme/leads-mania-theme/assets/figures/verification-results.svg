8b" font-weight="800" text-anchor="middle" letter-spacing="1">UNKNOWN</text><text x="689" y="218" font-family="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#64748b" font-weight="500" text-anchor="middle">Server refused</text><text x="689" y="258" font-family="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#0f1b4c" font-weight="700" text-anchor="middle">Retry, do not send</text><text x="400" y="316" font-family="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#64748b" font-weight="500" text-anchor="middle">Snov.io charges a credit for valid and invalid results; unknown results are not charged.</text></svg>