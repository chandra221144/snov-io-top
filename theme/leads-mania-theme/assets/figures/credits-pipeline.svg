<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 250" width="800" height="250" role="img" style="max-width:100%;height:auto"><defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#c7d2e8"/></marker>
<marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2455e6"/></marker>
</defs><text x="400" y="28" font-family="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" fill="#0f1b4c" font-weight="750" text-anchor="middle">One verified contact = about 2 credits</text><rect x="24" y="58" width="210" height="96" rx="10" fill="#fff" stroke="#c7d2e8" stroke-width="1.5"/><text x="44" y="86" font-family="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#2455e6" font-weight="800" text-anchor="start" letter-spacing="1">1. FIND</text><text x="44" y="112" font-family="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" fill="#0f1b4c" font-weight="700" text-anchor="start">Email address</text><text x="44" y="134" font-family="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#64748b" font-weight="500" text-anchor="start">− 1 credit</text><path d="M240 106 L288 106" stroke="#2455e6" stroke-width="2" fill="none" marker-end="url(#ahb)"/><rect x="294" y="58" width="210" height="96" rx="10" fill="#fff" stroke="#c7d2e8" stroke-width="1.5"/><text x="314" y="86" font-family="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#2455e6" font-weight="800" text-anchor="start" letter-spacing="1">2. VERIFY</text><text x="314" y="112" font-family="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" fill="#0f1b4c" font-weight="700" text-anchor="start">Is it deliverable?</text><text x="314" y="134" font-family="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#64748b" font-weight="500" text-anchor="start">− 1 credit</text><path d="M510 106 L558 106" stroke="#2455e6" stroke-width="2" fill="none" marker-end="url(#ahb)"/><rect x="564" y="58" width="212" height="96" rx="10" fill="#0f1b4c"/><text x="584" y="86" font-family="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#8caaff" font-weight="800" text-anchor="start" letter-spacing="1">RESULT</text><text x="584" y="112" font-family="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" fill="#fff" font-weight="750" text-anchor="start">1 verified contact</text><text x="584" y="134" font-family="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#c3cff0" font-weight="500" text-anchor="start">= 2 credits total</text><rect x="24" y="178" width="752" height="46" rx="10" fill="#f3f6ff" stroke="#dfe6ff" stroke-width="1.5"/><text x="44" y="206" font-family="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#31406b" font-weight="600" text-anchor="start">So a 1,000-credit Starter plan yields roughly 500 fully verified contacts — not 1,000.</text></svg>